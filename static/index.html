<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PrediMed ✨ Insurance Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="overlay"></div>

<div class="card fade-in">
    <h1>🌼 PrediMed</h1>
    <p class="subtitle">A gentle step towards smarter health planning</p>

    <form id="predictForm">

        <div class="field">
            <label>Age</label>
            <input type="number" id="age" required>
        </div>

        <div class="field">
            <label>Sex</label>
            <select id="sex" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>

        <div class="field">
            <label>BMI</label>
            <input type="number" step="0.1" id="bmi" required>
        </div>

        <div class="field">
            <label>Number of Children</label>
            <input type="number" id="children" required>
        </div>

        <div class="field">
            <label>Smoker</label>
            <select id="smoker" required>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="field">
            <label>Region</label>
            <select id="region" required>
                <option value="northwest">Northwest</option>
                <option value="northeast">Northeast</option>
                <option value="southeast">Southeast</option>
                <option value="southwest">Southwest</option>
            </select>
        </div>

        <button type="submit" class="glow-btn">
            ✨ Predict Insurance Cost
        </button>
    </form>

    <div id="result" class="result"></div>
    <div id="happy" class="happy-message"></div>

</div>

<script src="script.js"></script>
</body>
</html>
